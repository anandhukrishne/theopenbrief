<svg viewBox="0 0 160 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean, simple digital art stacked broadsheet articles pile -->
  <!-- Bottom Sheet -->
  <path d="M20 70L80 40L140 70L80 100Z" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2"/>
  
  <!-- Middle Sheet (slightly offset) -->
  <path d="M20 55L80 25L140 55L80 85Z" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="2"/>

  <!-- Top Sheet -->
  <path d="M20 40L80 10L140 40L80 70Z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2.5"/>

  <!-- Top Sheet Content Lines (Masthead + Columns) -->
  <!-- Masthead Bar -->
  <line x1="45" y1="28" x2="115" y2="28" stroke="currentColor" stroke-width="3" stroke-opacity="0.8"/>
  <line x1="45" y1="34" x2="115" y2="34" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Left Column Lines -->
  <line x1="45" y1="42" x2="72" y2="42" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="45" y1="47" x2="72" y2="47" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="45" y1="52" x2="68" y2="52" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Right Column Lines -->
  <line x1="88" y1="42" x2="115" y2="42" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="88" y1="47" x2="115" y2="47" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="88" y1="52" x2="108" y2="52" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>
</svg>
