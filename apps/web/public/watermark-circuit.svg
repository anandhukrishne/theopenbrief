<svg viewBox="0 0 180 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean, simple digital art circuit traces and chip -->
  <!-- Central Microchip -->
  <rect x="65" y="45" width="50" height="50" rx="4" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="2.5"/>
  <rect x="75" y="55" width="30" height="30" rx="2" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="90" cy="70" r="4" fill="currentColor" fill-opacity="0.6"/>

  <!-- Top Pins & Traces -->
  <line x1="75" y1="45" x2="75" y2="25" stroke="currentColor" stroke-width="2"/>
  <circle cx="75" cy="23" r="3" fill="currentColor" fill-opacity="0.7"/>

  <path d="M90 45V20L110 10H140" stroke="currentColor" stroke-width="2"/>
  <circle cx="140" cy="10" r="3" fill="currentColor" fill-opacity="0.7"/>

  <path d="M105 45V30L120 18H160" stroke="currentColor" stroke-width="2"/>
