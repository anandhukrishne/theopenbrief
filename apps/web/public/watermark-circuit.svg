  <circle cx="23" cy="80" r="3" fill="currentColor" fill-opacity="0.7"/>

  <!-- Right Pins & Traces -->
  <line x1="115" y1="60" x2="155" y2="60" stroke="currentColor" stroke-width="2"/>
  <circle cx="157" cy="60" r="3" fill="currentColor" fill-opacity="0.7"/>

  <path d="M115 80H135L150 95H170" stroke="currentColor" stroke-width="2"/>
