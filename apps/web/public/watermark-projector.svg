<svg viewBox="0 0 200 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean, simple digital art cinema projector with light beam -->
  <!-- Upper Film Reel -->
  <circle cx="50" cy="40" r="28" stroke="currentColor" stroke-width="4" stroke-opacity="0.8"/>
  <circle cx="50" cy="40" r="8" fill="currentColor" fill-opacity="0.7"/>
  <line x1="50" y1="12" x2="50" y2="68" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="22" y1="40" x2="78" y2="40" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="30" y1="20" x2="70" y2="60" stroke="currentColor" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="70" y1="20" x2="30" y2="60" stroke="currentColor" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Lower Film Reel -->
  <circle cx="50" cy="115" r="28" stroke="currentColor" stroke-width="4" stroke-opacity="0.8"/>
  <circle cx="50" cy="115" r="8" fill="currentColor" fill-opacity="0.7"/>
  <line x1="50" y1="87" x2="50" y2="143" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="22" y1="115" x2="78" y2="115" stroke="currentColor" stroke-width="2.5" stroke-opacity="0.6"/>
  <line x1="30" y1="95" x2="70" y2="135" stroke="currentColor" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="70" y1="95" x2="30" y2="135" stroke="currentColor" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Projector Body -->
  <rect x="58" y="55" width="48" height="50" rx="6" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="3.5"/>
  <circle cx="82" cy="80" r="10" stroke="currentColor" stroke-width="2.5" stroke-dasharray="3 3"/>

  <!-- Projection Lens Housing -->
  <path d="M106 68L122 62V98L106 92V68Z" fill="currentColor" fill-opacity="0.5" stroke="currentColor" stroke-width="3"/>

  <!-- Light Beam / Cone projecting outward -->
  <polygon points="122,64 195,30 195,130 122,96" fill="currentColor" fill-opacity="0.12"/>
  <line x1="122" y1="64" x2="195" y2="30" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
  <line x1="122" y1="96" x2="195" y2="130" stroke="currentColor" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.5"/>
</svg>
